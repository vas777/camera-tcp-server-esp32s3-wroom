[package]
edition      = "2024"
name         = "camera_tcp_server"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "camera_tcp_server"
path = "./src/main.rs"

[dependencies]
shared = { path = "../shared" } 

esp-hal = { version = "~1.1.0", features = ["esp32s3", "unstable" ,"log-04"] }

esp-rtos = { version = "0.3.0", features = ["esp-alloc", "esp-radio", "esp32s3", "embassy"] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }

edge-dhcp = { version = "0.7.0", features = ["log"] }
edge-nal = "0.6.0"
edge-nal-embassy = { version = "0.8.1", features = ["log"]}
embassy-executor = { version = "0.10.0", features = ["log", "executor-thread" ] }
embassy-net = { version = "0.8.0", features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "log" ] }

embassy-time = "0.5.0"

critical-section = "1.2.0"
embedded-io-async = "0.6.1"
esp-alloc = "0.10.0"
esp-radio = { version = "0.18.0", features = [
  "esp32s3",
  "wifi",
  "log-04",
] }


esp-println = { version = "0.17.0", features = ["log-04", "esp32s3" ] }
esp-backtrace = { version = "0.19.0", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
log = { version = "0.4.20" }
format_no_std = "1.2.0"
static_cell = "2.1.1"
embassy-sync = { version = "0.8.0", features = ["log"] }
embassy-futures = { version = "0.1.2", features = ["log"] }


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
